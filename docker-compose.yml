services:
  postgres:
    image: postgres:16
    container_name: novacrux-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: novacrux
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - novacrux-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d novacrux"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: novacrux-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - novacrux-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: novacrux-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novacrux-network

  localstack:
    image: localstack/localstack:3.8.1
    container_name: novacrux-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      DEBUG: "1"
      SERVICES: "s3"

      DOCKER_HOST: "unix:///var/run/docker.sock"
    volumes:
      - localstack_data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - novacrux-network

  ollama:
    image: ollama/ollama
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - D:/Ollama/Models:/root/.ollama
  qdrant:
    image: qdrant/qdrant:latest
    container_name: novacrux-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"

volumes:
  pgdata:
  redisdata:
  localstack_data:
  qdrant:

networks:
  novacrux-network:
    driver: bridge
